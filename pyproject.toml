[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-digital-ecosystem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "websockets>=14,<16",
  "python-multipart>=0.0.20", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "build>=1.2,<2"]
stt = ["faster-whisper>=1.1,<2"]
voice = ["faster-whisper>=1.1,<2", "piper-tts>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["shared/contracts", "apps/delta-core", "apps/delta-tasks", "apps/delta-agent"]
include = ["delta_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
