# Docker DNS; refresh upstream addresses after backend containers are recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream delta_core_backend {
    zone delta_core_backend 64k;
    server delta-core:8000 resolve;
}
upstream delta_tasks_backend {
    zone delta_tasks_backend 64k;
    server delta-tasks:8000 resolve;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    location /core/ {
        proxy_pass http://delta_core_backend/;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /tasks-api/ { proxy_pass http://delta_tasks_backend/; }
    location / { try_files $uri $uri/ /index.html; }
}
